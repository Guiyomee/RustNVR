[package]
name = "rustnvr-ai"
description = "RustNVR optional object recognition: provider trait and DeepStack/CodeProject.AI HTTP client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "json"] }
sha2 = "0.11.1"
tract-onnx = { version = "0.23.9", optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
rustnvr-core.workspace = true
jiff.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
tracing.workspace = true

[features]
# Built-in object recognition (ONNX models run in process by tract, pure Rust).
onnx = ["dep:tract-onnx", "dep:zune-jpeg"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[[example]]
name = "onnx_check"
required-features = ["onnx"]

[lints]
workspace = true
