[package]
name = "rustnvr-app"
description = "RustNVR binary: wiring, CLI, signals and graceful shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rustnvr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2 = "0.6.0"
base64.workspace = true
bytes.workspace = true
clap.workspace = true
rustnvr-ai.workspace = true
rustnvr-api.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustnvr-core.workspace = true
rustnvr-discovery.workspace = true
rustnvr-motion.workspace = true
rustnvr-mqtt.workspace = true
rustnvr-storage.workspace = true
rustnvr-recorder.workspace = true
rustnvr-remote.workspace = true
rustnvr-stream.workspace = true
serde.workspace = true
tokio.workspace = true
jiff.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
ring = "0.17"
serde_json = "1.0"
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Built-in object recognition (YOLOX ONNX models run in process, pure Rust).
default = ["onnx"]
onnx = ["rustnvr-ai/onnx"]

[dev-dependencies]
rustnvr-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
