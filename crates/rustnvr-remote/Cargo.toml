[package]
name = "rustnvr-remote"
description = "RustNVR remote destinations: finished segments uploaded to S3-compatible storage or an SFTP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
russh = "0.65.0"
