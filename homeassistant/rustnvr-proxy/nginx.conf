# Home Assistant ingress → RustNVR. The supervisor strips its prefix
# (/api/hassio_ingress/<token>) and names it in X-Ingress-Path; RustNVR
# serves its interface under it. Nginx passes the other headers on as they
# come (X-Forwarded-Host and -Proto: the address the browser used, checked by
# RustNVR against the page's origin).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    # Restoring a configuration backup sends it in one request.
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8099;
        # Only the Home Assistant supervisor (ingress).
        allow 172.30.32.2;
        deny all;

        location / {
            include /etc/nginx/rustnvr-server.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # RustNVR over HTTPS with its own certificate.
            proxy_ssl_server_name on;
            # Live video and the event WebSocket: no buffering, long-lived.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
