# Home Assistant ingress → RustNVR. The supervisor strips its prefix
# (/api/hassio_ingress/<token>) and names it in X-Ingress-Path; RustNVR
# serves its interface under it. Nginx passes the other headers on as they
# come (X-Forwarded-Host and -Proto: the address the browser used, checked by
# RustNVR against the page's origin).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    # Restoring a configuration backup sends it in one request.
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # $rustnvr_denied for the Home Assistant user, written by run.sh.
    include /etc/nginx/rustnvr-access.conf;

    # The user name shown on the refusal page, to copy into `users`; nothing
    # but these characters reaches the page.
    map $http_x_remote_user_name $rustnvr_user_shown {
        "~^(?<name>[A-Za-z0-9._@-]{1,64})$" $name;
        "" "(aucun nom reçu de Home Assistant / no name from Home Assistant)";
        default "?";
    }

    server {
        listen 8099;
        # Only the Home Assistant supervisor (ingress).
        allow 172.30.32.2;
        deny all;

        # Pages written here, not by RustNVR (proxied answers keep their type).
        default_type text/html;
        if ($rustnvr_denied = 1) {
            return 403 '<!doctype html><meta charset="utf-8"><title>RustNVR</title><p style="font-family:sans-serif">Le compte Home Assistant <b>$rustnvr_user_shown</b> n’est pas dans la liste « users » de l’app RustNVR Proxy : un administrateur peut l’y ajouter.<br>The Home Assistant user <b>$rustnvr_user_shown</b> is not in the « users » list of the RustNVR Proxy app: an administrator can add it there.</p>';
        }
        if ($rustnvr_denied = 2) {
            return 403 '<!doctype html><meta charset="utf-8"><title>RustNVR</title><p style="font-family:sans-serif">RustNVR n’a pas encore de comptes : le panneau reste fermé, sinon tout compte Home Assistant pourrait tout y modifier. Créez un compte administrateur en ouvrant RustNVR à son adresse, ou listez les comptes autorisés dans l’option « users » de l’app.<br>RustNVR has no accounts yet: the panel stays closed, or any Home Assistant user could change everything there. Create an administrator account by opening RustNVR at its address, or list the allowed users in the app’s « users » option.</p>';
        }
        if ($rustnvr_denied = 3) {
            return 503 '<!doctype html><meta charset="utf-8"><title>RustNVR</title><p style="font-family:sans-serif">RustNVR est injoignable depuis Home Assistant : vérifiez l’option « server » (journal de l’app). Nouvel essai toutes les 30 s.<br>RustNVR cannot be reached from Home Assistant: check the « server » option (app log). Retried every 30 s.</p>';
        }

        # Home page of the panel (`page` option), written by run.sh.
        include /etc/nginx/rustnvr-home.conf;

        location / {
            include /etc/nginx/rustnvr-server.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # RustNVR over HTTPS with its own certificate.
            proxy_ssl_server_name on;
            # Live video and the event WebSocket: no buffering, long-lived.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
