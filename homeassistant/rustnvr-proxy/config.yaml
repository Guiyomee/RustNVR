name: RustNVR Proxy (obsolète)
version: "1.2.0"
# Moved to the RustNVR-HomeAssistant repository: shown as deprecated in the
# app store of the users who added this one.
stage: deprecated
slug: rustnvr_proxy
description: Obsolète, ne reçoit plus de mises à jour. Installez « RustNVR Proxy » depuis le dépôt https://github.com/Guiyomee/RustNVR-HomeAssistant.
url: https://github.com/Guiyomee/RustNVR-HomeAssistant/tree/main/rustnvr-proxy
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:cctv
panel_title: RustNVR
# Every Home Assistant user sees the panel; run.sh lets them in only when
# RustNVR asks for a login, or when they are in `users`.
panel_admin: false
options:
  server: http://192.168.1.10:8080
  page: overview
  users: []
schema:
  server: url
  page: list(overview|wall|events|images|playback)?
  users:
    - str?
