# Checks the code, then (only if every check passes) builds the Docker image
# and publishes it to the GitHub registry:
#   ghcr.io/guiyomee/rustnvr:latest       every push to main
#   ghcr.io/guiyomee/rustnvr:2026.11.01   a release tag v2026.11.01
#   ghcr.io/guiyomee/rustnvr:sha-abc1234  every build
# Pull requests are checked, never published.
name: Checks and Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # FFmpeg: the motion detection tests and the decoding of recorded
      # segments (ffprobe) run instead of being skipped.
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web interface (typecheck + build)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Registry names must be lowercase.
          images: ghcr.io/guiyomee/rustnvr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=RustNVR
            org.opencontainers.image.description=Low-CPU network video recorder: RTSP H.264/H.265 recorded without re-encoding
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers kept between builds (the Rust build is the long part).
          cache-from: type=gha
          cache-to: type=gha,mode=max
