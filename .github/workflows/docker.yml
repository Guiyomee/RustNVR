# Builds the Docker image and publishes it to the GitHub registry:
#   ghcr.io/guiyomee/rustnvr:latest       every push to main
#   ghcr.io/guiyomee/rustnvr:2026.11.01   a release tag v2026.11.01
#   ghcr.io/guiyomee/rustnvr:sha-abc1234  every build
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Registry names must be lowercase.
          images: ghcr.io/guiyomee/rustnvr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=RustNVR
            org.opencontainers.image.description=Low-CPU network video recorder: RTSP H.264/H.265 recorded without re-encoding
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers kept between builds (the Rust build is the long part).
          cache-from: type=gha
          cache-to: type=gha,mode=max
