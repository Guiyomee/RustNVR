# Dependency updates, once a week, grouped: one pull request per ecosystem
# for the compatible updates. Security updates come as soon as published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        update-types: [minor, patch]

  # Actions are pinned by commit; Dependabot moves the commit and the
  # version in the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
